# Render Blueprint - Vantage PMO (free tier)
# Render -> New -> Blueprint -> select this repository.
# Clients use only the API Gateway URL. Private services are not available on the free plan,
# so each microservice also validates the JWT by itself (defense in depth).
# Free plan allows a single PostgreSQL instance per workspace, so the services reuse the existing
# free instance (smartgas-db); each service owns a private schema (DB_SCHEMA) that nobody else touches.
# Sprint 2: asynchronous events travel through a Render Key Value instance (Redis compatible) using
# Redis Streams with one consumer group per service (libs/event-bus). The services that use the
# shared library are built from the repository root.
envVarGroups:
  - name: vantage-security
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  - type: web
    name: vantage-pmo-api-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./api-gateway
    dockerfilePath: ./api-gateway/Dockerfile
    buildFilter:
      paths: ["api-gateway/**"]
    healthCheckPath: /health
    envVars:
      - fromGroup: vantage-security
      - key: PORT
        value: "3000"
      - key: PUBLIC_URL
        value: https://vantage-pmo-api-gateway.onrender.com
      - key: IAM_SERVICE_URL
        value: https://vantage-pmo-iam-service.onrender.com
      - key: PROJECT_TASK_SERVICE_URL
        value: https://vantage-pmo-project-task-service.onrender.com
      - key: RESOURCE_SERVICE_URL
        value: https://vantage-pmo-resource-service.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://vantage-pmo-notification-service.onrender.com
      - key: DOCUMENT_SERVICE_URL
        value: https://vantage-pmo-document-service.onrender.com
      - key: RISK_SERVICE_URL
        value: https://vantage-pmo-risk-service.onrender.com
      - key: UPSTREAM_TIMEOUT_MS
        value: "60000"   # free instances may need ~50 s to wake up

  - type: web
    name: vantage-pmo-iam-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./iam-service/Dockerfile
    buildFilter:
      paths: ["iam-service/**", "libs/**"]
    healthCheckPath: /health
    envVars:
      - fromGroup: vantage-security
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase: { name: smartgas-db, property: connectionString }
      - key: DB_SCHEMA
        value: iam
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: JWT_EXPIRES_IN
        value: "3600"
      - key: REDIS_URL
        fromService: { type: keyvalue, name: vantage-pmo-event-broker, property: connectionString }
      - key: SERVICE_NAME
        value: iam

  - type: web
    name: vantage-pmo-project-task-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./project-task-service/Dockerfile
    buildFilter:
      paths: ["project-task-service/**", "libs/**"]
    healthCheckPath: /health
    envVars:
      - fromGroup: vantage-security
      - key: PORT
        value: "3002"
      - key: DATABASE_URL
        fromDatabase: { name: smartgas-db, property: connectionString }
      - key: DB_SCHEMA
        value: project_task
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: REDIS_URL
        fromService: { type: keyvalue, name: vantage-pmo-event-broker, property: connectionString }
      - key: SERVICE_NAME
        value: project-task
      - key: ALERT_SCAN_INTERVAL_MS
        value: "3600000"

  - type: web
    name: vantage-pmo-resource-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./resource-service/Dockerfile
    buildFilter:
      paths: ["resource-service/**", "libs/**"]
    healthCheckPath: /health
    envVars:
      - fromGroup: vantage-security
      - key: PORT
        value: "3003"
      - key: DATABASE_URL
        fromDatabase: { name: smartgas-db, property: connectionString }
      - key: DB_SCHEMA
        value: resource
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: REDIS_URL
        fromService: { type: keyvalue, name: vantage-pmo-event-broker, property: connectionString }
      - key: SERVICE_NAME
        value: resource

  - type: web
    name: vantage-pmo-notification-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./notification-service/Dockerfile
    buildFilter:
      paths: ["notification-service/**", "libs/**"]
    healthCheckPath: /health
    envVars:
      - fromGroup: vantage-security
      - key: PORT
        value: "3004"
      - key: DATABASE_URL
        fromDatabase: { name: smartgas-db, property: connectionString }
      - key: DB_SCHEMA
        value: notification
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: REDIS_URL
        fromService: { type: keyvalue, name: vantage-pmo-event-broker, property: connectionString }
      - key: SERVICE_NAME
        value: notification

  - type: web
    name: vantage-pmo-document-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./document-service/Dockerfile
    buildFilter:
      paths: ["document-service/**", "libs/**"]
    healthCheckPath: /health
    envVars:
      - fromGroup: vantage-security
      - key: PORT
        value: "3005"
      - key: DATABASE_URL
        fromDatabase: { name: smartgas-db, property: connectionString }
      - key: DB_SCHEMA
        value: document
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: REDIS_URL
        fromService: { type: keyvalue, name: vantage-pmo-event-broker, property: connectionString }
      - key: SERVICE_NAME
        value: document

  - type: web
    name: vantage-pmo-risk-service
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./risk-service/Dockerfile
    buildFilter:
      paths: ["risk-service/**", "libs/**"]
    healthCheckPath: /health
    envVars:
      - fromGroup: vantage-security
      - key: PORT
        value: "3006"
      - key: DATABASE_URL
        fromDatabase: { name: smartgas-db, property: connectionString }
      - key: DB_SCHEMA
        value: risk
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: REDIS_URL
        fromService: { type: keyvalue, name: vantage-pmo-event-broker, property: connectionString }
      - key: SERVICE_NAME
        value: risk

  # Event broker: Redis Streams on Render Key Value (internal connections only).
  - type: keyvalue
    name: vantage-pmo-event-broker
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
