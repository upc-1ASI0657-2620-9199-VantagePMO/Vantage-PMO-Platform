# Render Blueprint - Vantage PMO (free tier)
# Render -> New -> Blueprint -> select this repository.
# Clients use only the API Gateway URL. Private services are not available on the free plan,
# so each microservice also validates the JWT by itself (defense in depth).
# Free plan allows a single PostgreSQL instance: each service owns a private schema (DB_SCHEMA).
databases:
  - name: vantage-pmo-db
    plan: free
    databaseName: vantage_pmo
    user: vantage

envVarGroups:
  - name: vantage-security
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  - type: web
    name: vantage-pmo-api-gateway
    runtime: docker
    plan: free
    rootDir: api-gateway
    healthCheckPath: /health
    envVars:
      - fromGroup: vantage-security
      - key: PORT
        value: 3000
      - key: PUBLIC_URL
        value: https://vantage-pmo-api-gateway.onrender.com
      - key: IAM_SERVICE_URL
        value: https://vantage-pmo-iam-service.onrender.com
      - key: PROJECT_TASK_SERVICE_URL
        value: https://vantage-pmo-project-task-service.onrender.com
      - key: UPSTREAM_TIMEOUT_MS
        value: 60000   # free instances may need ~50 s to wake up

  - type: web
    name: vantage-pmo-iam-service
    runtime: docker
    plan: free
    rootDir: iam-service
    healthCheckPath: /health
    envVars:
      - fromGroup: vantage-security
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase: { name: vantage-pmo-db, property: connectionString }
      - key: DB_SCHEMA
        value: iam
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 3600

  - type: web
    name: vantage-pmo-project-task-service
    runtime: docker
    plan: free
    rootDir: project-task-service
    healthCheckPath: /health
    envVars:
      - fromGroup: vantage-security
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        fromDatabase: { name: vantage-pmo-db, property: connectionString }
      - key: DB_SCHEMA
        value: project_task
      - key: DB_SYNCHRONIZE
        value: "true"
